{% extends "fastFile/layout.html" %}
{% block title %}Sign up{% endblock %}

{% block body %}
<div class="container auth-wrap">
    <div class="panel auth-card">
        {% include "fastFile/partials/auth_art.html" with heading="New account" %}
        <form class="auth-form" action="{% url 'register' %}" method="post">
            {% csrf_token %}
            <h1>Create account</h1>
            
            {% if message %}<div class="alert alert-error" role="alert"><i data-lucide="circle-alert"></i>{{ message }}</div>{% endif %}
            <div class="field">
                <label for="username">Username</label>
                <div class="input-wrap"><i data-lucide="at-sign"></i><input class="input" autofocus required id="username" type="text" name="username" autocomplete="username" placeholder="your_username"></div>
            </div>
            <div class="field">
                <label for="email">Email</label>
                <div class="input-wrap"><i data-lucide="mail"></i><input class="input" required id="email" type="email" name="email" autocomplete="email" placeholder="you@example.com"></div>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <div class="input-wrap"><i data-lucide="lock"></i><input class="input" required minlength="8" id="password" type="password" name="password" autocomplete="new-password" placeholder="At least 8 characters"><button type="button" class="toggle-pass" aria-label="Show password"><i data-lucide="eye"></i></button></div>
            </div>
            <div class="field">
                <label for="confirmation">Confirm password</label>
                <div class="input-wrap"><i data-lucide="lock-keyhole"></i><input class="input" required minlength="8" id="confirmation" type="password" name="confirmation" autocomplete="new-password" placeholder="Repeat the password"></div>
            </div>
            <button class="btn btn-primary btn-lg btn-block" type="submit"><span>Create account</span><i data-lucide="arrow-right"></i></button>
            <p class="auth-switch">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
        </form>
    </div>
</div>
{% endblock %}
